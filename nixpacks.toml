# Fallback for Railway's Nixpacks builder, used only if the Dockerfile build is
# switched off in the service settings. The Dockerfile is the primary path.
[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npx prisma migrate deploy && npm run start"
