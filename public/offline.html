<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Eleven Super Kings</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #f2f2f7;
        color: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 320px;
      }
      .badge {
        font-size: 40px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 6px;
      }
      p {
        font-size: 14px;
        color: rgba(60, 60, 67, 0.6);
        margin: 0 0 20px;
        line-height: 1.4;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: #007aff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">📡</div>
      <h1>You're offline</h1>
      <p>Match scores, collections and balances need a connection to load. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
